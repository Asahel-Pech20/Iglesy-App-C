    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Ministerios]
      summary: Reemplazar coordinadores (ADMIN_IGLESIA, PASTOR)
      description: Solo usuarios activos con rol COORDINADOR o PASTOR. Lista vacía permitida.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuarioIds]
              properties: { usuarioIds: { type: array, items: { type: string, format: uuid } } }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /ministerios/{id}/miembros:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Ministerios]
      summary: Integrantes (por defecto solo vínculos activos)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Q' }
        - { name: incluirHistoricos, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Integrante' } }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      tags: [Ministerios]
      summary: Vincular miembros (ADMIN_IGLESIA, PASTOR o COORDINADOR del ministerio)
      description: Reactiva vínculos previos; ids repetidos se ignoran; todo o nada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [miembroIds]
              properties: { miembroIds: { type: array, items: { type: string, format: uuid } } }
      responses:
        '200': { description: Ministerio actualizado }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /ministerios/{id}/miembros/{miembroId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: miembroId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Ministerios]
      summary: Desvincular (soft, guarda fechaSalida); ADMIN_IGLESIA, PASTOR o COORDINADOR del ministerio
      responses:
        '204': { $ref: '#/components/responses/SinContenido' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /eventos:
    get:
      tags: [Eventos]
      summary: Eventos (eventos:leer)
      description: |
        Con `desde` y `hasta` (rango de hasta 93 días) devuelve todo el rango sin paginar (máx. 500), ordenado por `fechaInicio asc`,
        incluyendo eventos que empiezan antes de `desde` y terminan dentro del rango (calendario).
        Una fecha sin hora (`yyyy-MM-dd`) es el día completo en la zona horaria de la iglesia.
        Sin rango: paginado y ordenado por `fechaInicio desc`. Los programados cuya fecha ya pasó se marcan `REALIZADO` al consultar.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/Orden' }
        - { name: desde, in: query, schema: { type: string, example: '2026-10-01' } }
        - { name: hasta, in: query, schema: { type: string, example: '2026-10-31T23:59:59Z' } }
        - { name: tipo, in: query, schema: { type: string, enum: [RELIGIOSO, ADMINISTRATIVO] } }
        - name: categoria
          in: query
          schema: { type: string, enum: [CULTO, REUNION, ACTIVIDAD, OTRO] }
        - name: estado
          in: query
          schema: { type: string, enum: [PROGRAMADO, CANCELADO, REALIZADO] }
        - { name: ministerioId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Evento' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Eventos]
      summary: Crear evento (eventos:crear; COORDINADOR solo con un ministerio que coordina)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/EventoEntrada' }
                - { required: [titulo, tipo, categoria, fechaInicio, lugar] }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { data: { $ref: '#/components/schemas/EventoDetalle' } },
                }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /eventos/proximos:
    get:
      tags: [Eventos]
      summary: Próximos eventos programados desde ahora (eventos:leer)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Evento' } }
  /eventos/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Eventos]
      summary: Detalle con responsables, ministerio, creador y resumenAsistencia
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { data: { $ref: '#/components/schemas/EventoDetalle' } },
                }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Eventos]
      summary: Editar (eventos:editar; COORDINADOR solo eventos de su ministerio)
      description: Un evento `CANCELADO` no se edita (422).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EventoEntrada' } } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /eventos/{id}/cancelar:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Eventos]
      summary: Cancelar (eventos:eliminar). No hay DELETE; la asistencia se conserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties: { motivo: { type: string, minLength: 5, maxLength: 300 } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /eventos/{id}/responsables:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Eventos]
      summary: Reemplaza los responsables (máx. 10 miembros activos)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [miembroIds]
              properties:
                miembroIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /eventos/{id}/asistencia:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Asistencia]
      summary: Pase de lista (asistencia:leer; COORDINADOR solo su ministerio)
      description: |
        Integrantes activos del ministerio del evento (o todos los miembros activos si no tiene ministerio),
        más quienes ya tienen registro aunque estén inactivos. `q` filtra por nombre; los totales son de toda la lista.
      parameters: [{ $ref: '#/components/parameters/Q' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { data: { $ref: '#/components/schemas/ListaAsistencia' } },
                }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Asistencia]
      summary: Registrar asistencia (upsert masivo, asistencia:crear)
      description: |
        Evento cancelado o que empieza en más de 1 día → 422. Reenviar la lista actualiza (no duplica).
        Si el evento ya empezó queda `REALIZADO`. Responde la lista actualizada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registros]
              properties:
                registros:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [miembroId, presente]
                    properties:
                      miembroId: { type: string, format: uuid }
                      presente: { type: boolean }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /asistencias:
    get:
      tags: [Asistencia]
      summary: Historial paginado con datos del evento (asistencia:leer; COORDINADOR solo sus ministerios)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: miembroId, in: query, schema: { type: string, format: uuid } }
        - { name: eventoId, in: query, schema: { type: string, format: uuid } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK (ordenado por fecha del evento desc) }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /asistencias/resumen:
    get:
      tags: [Asistencia]
      summary: Resumen semanal (semana ISO) o mensual en la zona horaria de la iglesia
      description: Serie continua (periodos sin datos con ceros). Por defecto 12 semanas o 6 meses hasta hoy; rango máx. 2 años.
      parameters:
        - name: periodo
          in: query
          required: true
          schema: { type: string, enum: [semanal, mensual] }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: ministerioId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        periodo: { type: string, example: '2026-W43' }
                        eventos: { type: integer }
                        presentes: { type: integer }
                        ausentes: { type: integer }
                        promedioPorEvento: { type: number }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /anuncios:
    get:
      tags: [Anuncios]
      summary: Anuncios paginados, IMPORTANTE primero (anuncios:leer)
      description: Con vigentes=true, publicados y no expirados; con vigentes=false, programados o expirados.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Q' }
        - { name: vigentes, in: query, schema: { type: boolean } }
        - name: estado
          in: query
          description: Pestañas del listado (paginadas por separado)
          schema: { type: string, enum: [vigentes, programados, expirados] }
        - { name: prioridad, in: query, schema: { type: string, enum: [NORMAL, IMPORTANTE] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Anuncio' } }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      tags: [Anuncios]
      summary: Publicar (anuncios:crear)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/AnuncioEntrada' }
                - { required: [titulo, contenido] }
      responses:
        '201': { description: Creado }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /anuncios/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Anuncios]
      summary: Detalle (anuncios:leer)
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Anuncios]
      summary: Editar (anuncios:editar)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AnuncioEntrada' } } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
    delete:
      tags: [Anuncios]
      summary: Eliminar (borrado físico, anuncios:eliminar)
      responses:
        '204': { $ref: '#/components/responses/SinContenido' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /public/cartelera:
    get:
      tags: [Público]
      summary: Cartelera pública (sin sesión; cache 60 s; 60 solicitudes/min por IP)
      description: Solo datos públicos; no incluye miembros, usuarios ni responsables.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      iglesia:
                        type: object
                        properties:
                          nombre: { type: string }
                          logoUrl: { type: string, nullable: true }
                          direccion: { type: string, nullable: true }
                          ciudad: { type: string, nullable: true }
                          telefono: { type: string, nullable: true }
                          email: { type: string, nullable: true }
                          sitioWeb: { type: string, nullable: true }
                      horarios: { type: array, items: { $ref: '#/components/schemas/Horario' } }
                      anuncios: { type: array, items: { type: object } }
                      eventosProximos: { type: array, items: { type: object } }
        '429': { description: Demasiadas solicitudes }

  /donaciones:
    get:
      tags: [Donaciones]
      summary: Aportaciones paginadas por fecha desc (donaciones:leer — ADMIN_IGLESIA, PASTOR, TESORERO)
      description: Excluye anuladas salvo incluirAnuladas=true. meta.totalMonto suma el filtro completo sin anuladas.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Orden' }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: concepto, in: query, schema: { type: string } }
        - { name: metodo, in: query, schema: { type: string } }
        - { name: miembroId, in: query, schema: { type: string, format: uuid } }
        - { name: anonima, in: query, schema: { type: boolean } }
        - { name: incluirAnuladas, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Donacion' } }
                  meta:
                    allOf:
                      - { $ref: '#/components/schemas/Meta' }
                      - { type: object, properties: { totalMonto: { type: string } } }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Donaciones]
      summary: Registrar aportación (donaciones:crear — ADMIN_IGLESIA, TESORERO)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/DonacionEntrada' }
                - { required: [fecha, monto, concepto, metodo] }
      responses:
        '201': { description: Creada }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /donaciones/resumen:
    get:
      tags: [Donaciones]
      summary: Ingresos agrupados (donaciones:leer)
      description: Serie continua (periodos o valores sin datos van en "0.00"). Sin fechas, el mes en curso. Rango máximo 2 años.
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - name: agrupar
          in: query
          schema: { type: string, enum: [dia, semana, mes, concepto, metodo], default: mes }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      desde: { type: string, format: date }
                      hasta: { type: string, format: date }
                      agrupar: { type: string }
                      total: { type: string }
                      cantidad: { type: integer }
                      grupos: { type: array, items: { $ref: '#/components/schemas/GrupoIngresos' } }
        '400': { $ref: '#/components/responses/Validacion' }
  /donaciones/resumen-mensual:
    get:
      tags: [Donaciones]
      summary: Resumen de un mes (donaciones:leer)
      description: total, mesAnterior, variacionPorcentual (null sin ingresos el mes anterior), porConcepto, porMetodo, anonimas e identificadas. Sin parámetros, el mes en curso.
      parameters:
        - { name: anio, in: query, schema: { type: integer } }
        - { name: mes, in: query, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
  /donaciones/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Donaciones]
      summary: Detalle con auditoría (donaciones:leer)
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Donaciones]
      summary: Editar (donaciones:editar); una anulada → 422
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DonacionEntrada' } } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /donaciones/{id}/anular:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Donaciones]
      summary: Anular con motivo (donaciones:eliminar); no existe DELETE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties: { motivo: { type: string, minLength: 5, maxLength: 300 } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Panel principal (dashboard:leer); cache de 60 s que se invalida al cambiar los datos
      description: La clave `ingresos` se omite (no es null) si el rol no tiene donaciones:leer.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      miembrosActivos: { type: integer }
                      totalMinisterios: { type: integer }
                      asistenciasRegistradas:
                        type: object
                        properties:
                          mesActual: { type: integer }
                          semanaActual: { type: integer }
                      eventosProximos:
                        { type: array, items: { $ref: '#/components/schemas/Evento' } }
                      anunciosImportantes:
                        { type: array, items: { $ref: '#/components/schemas/Anuncio' } }
                      graficas:
                        type: object
                        properties:
                          asistenciaSemanal: { type: array, items: { type: object } }
                          miembrosPorMinisterio: { type: array, items: { type: object } }
                          altasMiembrosPorMes: { type: array, items: { type: object } }
                      ingresos:
                        type: object
                        properties:
                          mesActual: { type: string }
                          mesAnterior: { type: string }
                          variacionPorcentual: { type: number, nullable: true }
                          porMes: { type: array, items: { type: object } }

  /reportes/miembros:
    get:
      tags: [Reportes]
      summary: Reporte general de miembros (reportes:generales; COORDINADOR solo sus ministerios)
      parameters:
        - name: estado
          in: query
          schema: { type: string, enum: [activo, inactivo, todos], default: activo }
        - { $ref: '#/components/parameters/Formato' }
      responses:
        '200': { $ref: '#/components/responses/Reporte' }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /reportes/asistencia:
    get:
      tags: [Reportes]
      summary: Asistencia por evento (eventoId) o por periodo semanal/mensual (reportes:generales)
      parameters:
        - { name: eventoId, in: query, schema: { type: string, format: uuid } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - name: periodo
          in: query
          schema: { type: string, enum: [semanal, mensual], default: semanal }
        - { $ref: '#/components/parameters/Formato' }
      responses:
        '200': { $ref: '#/components/responses/Reporte' }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /reportes/ministerios:
    get:
      tags: [Reportes]
      summary: Participación por ministerio (reportes:generales; COORDINADOR solo sus ministerios)
      parameters:
        - { name: ministerioId, in: query, schema: { type: string, format: uuid } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Formato' }
      responses:
        '200': { $ref: '#/components/responses/Reporte' }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /reportes/ingresos:
    get:
      tags: [Reportes]
      summary: Ingresos por periodo (reportes:ingresos — ADMIN_IGLESIA, PASTOR, TESORERO)
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - name: agrupar
          in: query
          schema: { type: string, enum: [dia, semana, mes, concepto, metodo], default: mes }
        - { $ref: '#/components/parameters/Formato' }
      responses:
        '200': { $ref: '#/components/responses/Reporte' }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }

  # ───────────── Ecclesia · Misas (versión mínima) y diezmo ─────────────
  /iglesias/{iglesiaId}/padres:
    parameters: [{ $ref: '#/components/parameters/IglesiaId' }]
    get:
      tags: [Misas]
      summary: Padres registrados (misas:leer)
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      tags: [Misas]
      summary: Registrar un padre (misas:registrar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties: { nombre: { type: string, maxLength: 120 } }
      responses:
        '201': { description: Creado }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /iglesias/{iglesiaId}/misas-celebradas:
    parameters: [{ $ref: '#/components/parameters/IglesiaId' }]
    get:
      tags: [Misas]
      summary: Misas celebradas del periodo con su diezmo (misas:leer); por omisión, el mes en curso
      parameters:
        - { $ref: '#/components/parameters/DesdeDia' }
        - { $ref: '#/components/parameters/HastaDia' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Misas]
      summary: Registrar una misa ya celebrada (misas:registrar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inicio, padreId]
              properties:
                inicio:
                  { type: string, format: date-time, description: Instante de inicio (ISO 8601) }
                padreId: { type: string, format: uuid }
      responses:
        '201': { description: Creado }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }

  /iglesias/{iglesiaId}/misas-celebradas/{misaId}/diezmo:
    parameters:
      - { $ref: '#/components/parameters/IglesiaId' }
      - { $ref: '#/components/parameters/MisaId' }
    post:
      tags: [Diezmo]
      summary: Capturar el diezmo de una misa celebrada, una sola vez (diezmo:capturar, TESORERO)
      description: >
        El monto viaja como texto con hasta 2 decimales. 409 si la misa ya tiene captura (se corrige con PATCH);
        422 si la misa todavía no se celebra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monto]
              properties: { monto: { type: string, example: '1250.50' } }
      responses:
        '201': { description: Creado }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
    get:
      tags: [Diezmo]
      summary: Captura vigente con su historial de correcciones (diezmo:leer, ADMIN_IGLESIA y TESORERO)
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Diezmo]
      summary: Corregir el monto; guarda quién, cuándo y la cantidad anterior (diezmo:capturar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monto]
              properties: { monto: { type: string, example: '1520.50' } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }

  /iglesias/{iglesiaId}/diezmos:
    parameters: [{ $ref: '#/components/parameters/IglesiaId' }]
    get:
      tags: [Diezmo]
      summary: Capturas del periodo, la más reciente primero (diezmo:leer)
      parameters:
        - { $ref: '#/components/parameters/DesdeDia' }
        - { $ref: '#/components/parameters/HastaDia' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /iglesias/{iglesiaId}/diezmo/resumen:
    parameters: [{ $ref: '#/components/parameters/IglesiaId' }]
    get:
      tags: [Diezmo]
      summary: Total, promedio por misa y misas con más y con menos diezmo (diezmo:leer)
      description: Sumas en SQL sobre Decimal(12,2). Reporte solo para el personal de esa iglesia.
      parameters:
        - { $ref: '#/components/parameters/DesdeDia' }
        - { $ref: '#/components/parameters/HastaDia' }
      responses:
        '200': { description: 'OK: desde, hasta, misas, total, promedio, conMas y conMenos' }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /iglesias/{iglesiaId}/diezmo/agrupado:
    parameters: [{ $ref: '#/components/parameters/IglesiaId' }]
    get:
      tags: [Diezmo]
      summary: Diezmo por día, semana, mes, horario de misa o padre, en la hora local de la iglesia (diezmo:leer)
      parameters:
        - { $ref: '#/components/parameters/DesdeDia' }
        - { $ref: '#/components/parameters/HastaDia' }
        - name: por
          in: query
          required: true
          schema: { type: string, enum: [dia, semana, mes, horario, padre] }
      responses:
        '200': { description: 'OK: desde, hasta, por y grupos con clave, etiqueta, misas y total' }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }

  # ───────── Espacios: criptas, nichos, columbarios y osarios (E4-08 a E4-11) ─────────

  /public/iglesias/{iglesiaId}/espacios:
    get:
      tags: [Espacios]
      summary: Tipos de espacio que ofrece la iglesia, SIN precios (sin sesión; 60/min por IP)
      description: >
        Solo los tipos activos y disponibles. Una iglesia cerrada responde 200 con la lista vacía.
        RF-71, RN-47, RN-48.
      security: []
      parameters:
        - { name: iglesiaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'OK: iglesia { id, nombre } y tipos [{ id, clase }]' }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /public/iglesias/{iglesiaId}/solicitudes-espacio:
    post:
      tags: [Espacios]
      summary: Solicitar un espacio sin cuenta (sin sesión; 10/min por IP)
      description: >
        Devuelve el folio (ESP-2026-000123) y la clave (10 caracteres, «ABCDE-FGHJK») UNA sola vez; la
        clave solo se guarda como hash SHA-256. Hace falta un teléfono o un correo (supuesto P-25).
        422 si la iglesia está cerrada o el tipo no está activo y disponible. RF-72, RF-73, RN-49.
      security: []
      parameters:
        - { name: iglesiaId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipoEspacioId, contacto]
              properties:
                tipoEspacioId: { type: string, format: uuid }
                contacto:
                  type: object
                  required: [nombre]
                  properties:
                    nombre: { type: string, maxLength: 150 }
                    telefono: { type: string }
                    correo: { type: string, format: email }
                comentarios: { type: string, maxLength: 1000 }
      responses:
        '201': { description: 'Creada: folio, clave, estado, iglesia { nombre } y aviso' }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
        '429': { description: Demasiadas solicitudes desde esta IP }

  /public/solicitudes-espacio/{folio}/consulta:
    post:
      tags: [Espacios]
      summary: Consultar el estado y la cotización con folio y clave (sin sesión; 30/min por IP)
      description: >
        El estado es el efectivo: una cotización vencida se ve «VENCIDA». Incluye con quién se hace
        (nombre, teléfono y correo de la iglesia) y las fechas en la hora local de la iglesia. Un folio
        inexistente y una clave incorrecta dan el mismo 404. Tras 5 claves incorrectas el folio se
        bloquea 15 minutos (429). Nunca devuelve la clave. RF-74.
      security: []
      parameters:
        - { name: folio, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clave]
              properties:
                clave: { type: string }
      responses:
        '200':
          {
            description: 'OK: folio, estado, tipo { clase }, iglesia, creadaEn, creadaLocal y cotizacion',
          }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { description: Folio bloqueado temporalmente o demasiadas solicitudes }

  /public/solicitudes-espacio/{folio}/aceptar:
    post:
      tags: [Espacios]
      summary: Aceptar el precio de la cotización (folio y clave)
      description: >
        422 si la cotización venció (el vencimiento queda guardado), si no hay cotización o si la
        iglesia está cerrada. RF-78, RN-52, CA-28, CA-29.
      security: []
      parameters:
        - { name: folio, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [clave], properties: { clave: { type: string } } }
      responses:
        '200': { description: 'OK: la solicitud en estado ACEPTADA' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
        '429': { description: Folio bloqueado temporalmente o demasiadas solicitudes }

  /public/solicitudes-espacio/{folio}/rechazar:
    post:
      tags: [Espacios]
      summary: Rechazar el precio de la cotización (folio y clave)
      security: []
      parameters:
        - { name: folio, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [clave], properties: { clave: { type: string } } }
      responses:
        '200': { description: 'OK: la solicitud en estado RECHAZADA' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
        '429': { description: Folio bloqueado temporalmente o demasiadas solicitudes }

  /public/solicitudes-espacio/{folio}/cancelar:
    post:
      tags: [Espacios]
      summary: Cancelar la solicitud mientras no se haya aceptado (folio y clave)
      description: 422 si ya se aceptó (RN-52), si la cotización venció o si la iglesia está cerrada. RF-80.
      security: []
      parameters:
        - { name: folio, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [clave], properties: { clave: { type: string } } }
      responses:
        '200': { description: 'OK: la solicitud en estado CANCELADA (conserva su historial)' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
        '429': { description: Folio bloqueado temporalmente o demasiadas solicitudes }

  /iglesias/{iglesiaId}/tipos-espacio:
    parameters: [{ $ref: '#/components/parameters/IglesiaId' }]
    get:
      tags: [Espacios]
      summary: Tipos de espacio de la iglesia, activos o no (espacios:leer)
      responses:
        '200': { description: 'OK: [{ id, clase, activo, disponible }]' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Espacios]
      summary: Agregar un tipo de espacio (espacios:gestionar)
      description: La Coordinación no entra (datos privados de la iglesia). 409 si ya tiene esa clase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clase]
              properties:
                clase: { type: string, enum: [CRIPTA, NICHO, COLUMBARIO, OSARIO] }
                disponible: { type: boolean }
      responses:
        '201': { description: Creado }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }

  /iglesias/{iglesiaId}/tipos-espacio/{id}:
    parameters:
      - { $ref: '#/components/parameters/IglesiaId' }
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Espacios]
      summary: Activar, desactivar o marcar sin lugar un tipo (espacios:gestionar)
      description: No se borra, para conservar sus solicitudes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                activo: { type: boolean }
                disponible: { type: boolean }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }

  /iglesias/{iglesiaId}/solicitudes-espacio:
    parameters: [{ $ref: '#/components/parameters/IglesiaId' }]
    get:
      tags: [Espacios]
      summary: Solicitudes de la iglesia, con datos de contacto (espacios:leer)
      description: >
        `estado` filtra por el estado efectivo (una cotizada vencida cuenta como VENCIDA).
        La respuesta nunca incluye la clave ni su hash. RF-75, RN-53.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: estado
          in: query
          schema:
            type: string
            enum: [RECIBIDA, SIN_LUGAR, COTIZADA, ACEPTADA, RECHAZADA, VENCIDA, CANCELADA]
      responses:
        '200': { description: Lista paginada }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /iglesias/{iglesiaId}/solicitudes-espacio/{id}:
    parameters:
      - { $ref: '#/components/parameters/IglesiaId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Espacios]
      summary: Detalle de una solicitud con contacto y cotización (espacios:leer)
      description: Una solicitud de otra iglesia responde 404 con la ruta propia (RN-54).
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /iglesias/{iglesiaId}/solicitudes-espacio/{id}/cotizacion:
    parameters:
      - { $ref: '#/components/parameters/IglesiaId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Espacios]
      summary: Cotizar una solicitud recibida (espacios:gestionar)
      description: >
        El monto viaja como texto con hasta 2 decimales y mayor que cero. Vale 15 días desde que se
        emite. 422 si la solicitud no está «Recibida». RF-77, RN-50, RN-51, CA-28.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monto, condiciones]
              properties:
                monto: { type: string, example: '12500.50' }
                condiciones: { type: string, maxLength: 2000 }
      responses:
        '201': { description: 'Creada: la solicitud en estado COTIZADA con su cotización' }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }

  /iglesias/{iglesiaId}/solicitudes-espacio/{id}/sin-lugar:
    parameters:
      - { $ref: '#/components/parameters/IglesiaId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Espacios]
      summary: Avisar que no hay lugar (espacios:gestionar)
      description: 422 si la solicitud no está «Recibida». RF-76, CA-27.
      responses:
        '200': { description: 'OK: la solicitud en estado SIN_LUGAR' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
