openapi: 3.0.3
info:
  title: AppIglesia API
  version: 1.0.0
  description: |
    Contrato de la API (specs.md §7). Respuestas `{ data, meta? }`; errores `{ error: { code, message, details? } }`.
    Cada dueño agrega aquí las rutas de su módulo (B2: miembros/ministerios, B3: eventos/asistencia/anuncios/public, B4: donaciones/dashboard/reportes).
servers:
  - url: /api/v1
tags:
  - name: Sistema
  - name: Auth
  - name: Usuarios
  - name: Configuración
  - name: Miembros
  - name: Ministerios
  - name: Eventos
  - name: Asistencia
  - name: Anuncios
  - name: Público
  - name: Donaciones
  - name: Dashboard
  - name: Reportes
  - name: Iglesias
  - name: Catálogos
  - name: Misas
  - name: Diezmo
  - name: Patrimonio
  - name: Espacios

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieRefresh:
      type: apiKey
      in: cookie
      name: refreshToken
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IglesiaId:
      name: iglesiaId
      in: path
      required: true
      description: Iglesia del personal. Si no es la del usuario es 403; si no existe, 404 (alcanceIglesia).
      schema: { type: string, format: uuid }
    MisaId:
      name: misaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DesdeDia:
      name: desde
      in: query
      description: aaaa-mm-dd, hora local de la iglesia
      schema: { type: string, format: date }
    HastaDia:
      name: hasta
      in: query
      description: aaaa-mm-dd, incluye el día completo
      schema: { type: string, format: date }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Q: { name: q, in: query, schema: { type: string } }
    Orden: { name: orden, in: query, schema: { type: string, example: 'nombre:asc' } }
    Formato:
      name: formato
      in: query
      description: json (vista previa), pdf o xlsx (archivo adjunto reporte-<tipo>-<fecha>)
      schema: { type: string, enum: [json, pdf, xlsx], default: json }
  schemas:
    Rol:
      type: string
      enum: [COORDINACION, ADMIN_IGLESIA, PASTOR, SECRETARIO, TESORERO, COORDINADOR]
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  VALIDATION_ERROR,
                  UNAUTHENTICATED,
                  TOKEN_EXPIRED,
                  FORBIDDEN,
                  NOT_FOUND,
                  CONFLICT,
                  BUSINESS_RULE,
                  RATE_LIMITED,
                  INTERNAL_ERROR,
                ]
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  campo: { type: string }
                  mensaje: { type: string }
    IglesiaDatos:
      description: Datos de la ficha (E2-06). Opcionales; vacío o null borra el dato.
      type: object
      properties:
        direccion: { type: string, maxLength: 250, nullable: true }
        estado:
          { type: string, pattern: '^\d{2}$', nullable: true, description: Clave INEGI del estado }
        municipio:
          {
            type: string,
            pattern: '^\d{5}$',
            nullable: true,
            description: Clave INEGI de 5 dígitos; debe ser del estado (RN-09),
          }
        localidad:
          {
            type: string,
            pattern: '^\d{9}$',
            nullable: true,
            description: Clave INEGI de 9 dígitos; debe ser del municipio (RN-09),
          }
        capacidad: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        anioConstruccion: { type: integer, minimum: 1500, maximum: 2100, nullable: true }
        telefono: { type: string, nullable: true, description: 7 a 15 dígitos }
        correo: { type: string, format: email, nullable: true }
        latitud:
          { type: number, minimum: -90, maximum: 90, nullable: true, description: Va con longitud }
        longitud:
          { type: number, minimum: -180, maximum: 180, nullable: true, description: Va con latitud }
    LugarInegi:
      type: object
      nullable: true
      properties:
        clave: { type: string }
        nombre: { type: string }
    TipoObjeto:
      type: string
      enum:
        [
          IMAGEN,
          RETABLO,
          PINTURA,
          MURAL,
          ORGANO,
          PIANO,
          ORFEBRERIA,
          MOBILIARIO_LITURGICO,
          DOCUMENTO,
          OTRO,
        ]
    EstadoObjeto:
      type: string
      enum: [VIGENTE, PERDIDO, PRESTADO, BAJA]
    ObjetoEntrada:
      type: object
      description: Año o siglo (al menos uno; con los dos, el año debe ser de ese siglo). En PATCH todo es opcional.
      required: [descripcion, tipo, material, estadoConservacion, ubicacionEnTemplo, catalogadoInah]
      properties:
        descripcion: { type: string, maxLength: 200 }
        tipo: { $ref: '#/components/schemas/TipoObjeto' }
        anio: { type: integer, nullable: true, minimum: 1, maximum: 2100 }
        siglo:
          {
            type: integer,
            nullable: true,
            minimum: 1,
            maximum: 21,
            description: '18 = siglo XVIII',
          }
        material: { type: string, maxLength: 120 }
        estadoConservacion: { type: string, maxLength: 120 }
        ubicacionEnTemplo: { type: string, maxLength: 150 }
        catalogadoInah: { type: boolean }
    ObjetoPatrimonial:
      allOf:
        - { $ref: '#/components/schemas/ObjetoEntrada' }
        - type: object
          properties:
            id: { type: string, format: uuid }
            grupo: { type: string, description: Grupo del multiplicador (RN-16) }
            epoca: { type: string, description: 'El año o «siglo XVIII» (RF-17)' }
            antiguedad: { type: integer }
            estado: { $ref: '#/components/schemas/EstadoObjeto' }
            fechaEstado: { type: string, format: date, nullable: true }
            motivoEstado: { type: string, nullable: true }
            puntos: { type: number, description: Lo que suma hoy al índice; 0 si no es vigente }
    CriteriosIndice:
      type: object
      required: [rangosEdad, multiplicadores, puntosInah, distinciones]
      properties:
        rangosEdad:
          type: array
          items:
            {
              type: object,
              properties: { desdeAnios: { type: integer }, puntos: { type: number } },
            }
        multiplicadores:
          type: object
          properties:
            IMAGEN: { type: number }
            RETABLO_PINTURA_MURAL: { type: number }
            ORGANO_PIANO: { type: number }
            ORFEBRERIA_MOBILIARIO_DOCUMENTO: { type: number }
            OTRO: { type: number }
        puntosInah: { type: number }
        distinciones:
          type: array
          items:
            { type: object, properties: { minimo: { type: number }, nombre: { type: string } } }
    IglesiaReconocida:
      type: object
      properties:
        posicion: { type: integer }
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { type: string }
        estado: { $ref: '#/components/schemas/LugarInegi' }
        municipio: { $ref: '#/components/schemas/LugarInegi' }
        localidad: { $ref: '#/components/schemas/LugarInegi' }
        indice: { type: number }
        distincion: { type: string, nullable: true }
    FichaIglesia:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { type: string }
        ubicacion: { type: object }
        capacidad: { type: integer, nullable: true }
        anioConstruccion: { type: integer, nullable: true }
        contacto: { type: object }
        coordenadas: { type: object, description: Se omite si no se conocen }
        indice: { type: number }
        distincion: { type: string, nullable: true }
        anioCalculo: { type: integer }
        objetos: { type: array, items: { type: object } }
        servicios: { type: array, items: { type: object } }
        platicas: { type: array, items: { type: object } }
        misas: { type: array, items: { type: object } }
        tiposEspacio: { type: array, items: { type: object } }
    IglesiaPublica:
      type: object
      description: Lo que ve el visitante en la lista (sin contacto, coordenadas ni datos de cierre)
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { type: string, enum: [CATEDRAL, BASILICA, PARROQUIA, TEMPLO, CAPILLA, SANTUARIO] }
        direccion: { type: string, nullable: true }
        capacidad: { type: integer, nullable: true }
        municipio: { $ref: '#/components/schemas/LugarInegi' }
        localidad: { $ref: '#/components/schemas/LugarInegi' }
        indice: { type: number, description: Índice patrimonial (RF-18) }
        distincion: { type: string, nullable: true }
    Iglesia:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { type: string, enum: [CATEDRAL, BASILICA, PARROQUIA, TEMPLO, CAPILLA, SANTUARIO] }
        zonaHoraria: { type: string }
        activa: { type: boolean }
        direccion: { type: string, nullable: true }
        estado: { $ref: '#/components/schemas/LugarInegi' }
        municipio: { $ref: '#/components/schemas/LugarInegi' }
        localidad: { $ref: '#/components/schemas/LugarInegi' }
        capacidad: { type: integer, nullable: true }
        anioConstruccion: { type: integer, nullable: true }
        telefono: { type: string, nullable: true }
        correo: { type: string, nullable: true }
        latitud: { type: string, nullable: true, example: '19.043100' }
        longitud: { type: string, nullable: true, example: '-98.198200' }
        fechaCierre: { type: string, format: date, nullable: true }
        motivoCierre: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Meta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        email: { type: string, format: email }
        rol: { $ref: '#/components/schemas/Rol' }
        activo: { type: boolean }
        iglesiaId:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: Null solo para la Coordinación,
          }
        ultimoAcceso: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Sesion:
      type: object
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
        permisos:
          type: array
          items: { type: string, example: 'miembros:leer' }
        iglesia:
          type: object
          nullable: true
          description: Iglesia del personal (E1-02); null solo en la Coordinación
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            activa: { type: boolean }
    Configuracion:
      type: object
      properties:
        nombre: { type: string }
        logoUrl: { type: string, nullable: true, description: URL absoluta del logotipo }
        direccion: { type: string, nullable: true }
        ciudad: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        email: { type: string, nullable: true }
        sitioWeb: { type: string, nullable: true }
        moneda: { type: string, example: MXN }
        zonaHoraria: { type: string, example: America/Mexico_City }
    Horario:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        diaSemana: { type: integer, minimum: 0, maximum: 6, description: '0 = domingo' }
        horaInicio: { type: string, example: '10:00' }
        horaFin: { type: string, nullable: true, example: '12:00' }
        lugar: { type: string, nullable: true }
        activo: { type: boolean }
    MiembroEntrada:
      type: object
      properties:
        nombre: { type: string, maxLength: 80 }
        apellidos: { type: string, maxLength: 120 }
        fechaIngreso: { type: string, format: date, description: No futura }
        telefono:
          {
            type: string,
            nullable: true,
            description: '7–15 dígitos; se aceptan +, espacios y guiones (se guarda sin separadores)',
          }
        email: { type: string, format: email, nullable: true }
        fechaNacimiento: { type: string, format: date, nullable: true }
        direccion: { type: string, nullable: true }
        notas: { type: string, nullable: true }
    Miembro:
      allOf:
        - { $ref: '#/components/schemas/MiembroEntrada' }
        - type: object
          properties:
            id: { type: string, format: uuid }
            activo: { type: boolean }
            fechaBaja: { type: string, format: date, nullable: true }
            motivoBaja: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MinisterioResumen:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
    Ministerio:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        activo: { type: boolean }
        totalIntegrantes: { type: integer, description: Vínculos activos }
        coordinadores:
          type: array
          items: { type: object, properties: { id: { type: string }, nombre: { type: string } } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Integrante:
      type: object
      properties:
        id: { type: string, format: uuid, description: Id del miembro }
        nombre: { type: string }
        apellidos: { type: string }
        telefono: { type: string, nullable: true }
        email: { type: string, nullable: true }
        miembroActivo: { type: boolean }
        activo: { type: boolean, description: Vínculo activo }
        fechaUnion: { type: string, format: date-time }
        fechaSalida: { type: string, format: date-time, nullable: true }
    EventoEntrada:
      type: object
      properties:
        titulo: { type: string, maxLength: 150 }
        descripcion: { type: string, maxLength: 2000, nullable: true }
        tipo: { type: string, enum: [RELIGIOSO, ADMINISTRATIVO] }
        categoria: { type: string, enum: [CULTO, REUNION, ACTIVIDAD, OTRO] }
        fechaInicio: { type: string, format: date-time }
        fechaFin:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: 'Igual o posterior a fechaInicio',
          }
        lugar: { type: string, maxLength: 150 }
        ministerioId: { type: string, format: uuid, nullable: true }
    Evento:
      type: object
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        descripcion: { type: string, nullable: true }
        tipo: { type: string, enum: [RELIGIOSO, ADMINISTRATIVO] }
        categoria: { type: string, enum: [CULTO, REUNION, ACTIVIDAD, OTRO] }
        fechaInicio: { type: string, format: date-time }
        fechaFin: { type: string, format: date-time, nullable: true }
        lugar: { type: string }
        estado: { type: string, enum: [PROGRAMADO, CANCELADO, REALIZADO] }
        motivoCancelacion: { type: string, nullable: true }
        ministerio:
          allOf: [{ $ref: '#/components/schemas/MinisterioResumen' }]
          nullable: true
        totalResponsables: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EventoDetalle:
      allOf:
        - { $ref: '#/components/schemas/Evento' }
        - type: object
          properties:
            creadoPor:
              { type: object, properties: { id: { type: string }, nombre: { type: string } } }
            responsables:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nombre: { type: string }
                  apellidos: { type: string }
                  activo: { type: boolean }
            resumenAsistencia:
              type: object
              nullable: true
              properties:
                presentes: { type: integer }
                ausentes: { type: integer }
                total: { type: integer }
    MiembroBreve:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        apellidos: { type: string }
    ListaAsistencia:
      type: object
      properties:
        evento:
          type: object
          properties:
            id: { type: string, format: uuid }
            titulo: { type: string }
            fechaInicio: { type: string, format: date-time }
            fechaFin: { type: string, format: date-time, nullable: true }
            estado: { type: string, enum: [PROGRAMADO, CANCELADO, REALIZADO] }
            ministerio:
              allOf: [{ $ref: '#/components/schemas/MinisterioResumen' }]
              nullable: true
        registros:
          type: array
          items:
            type: object
            properties:
              miembro: { $ref: '#/components/schemas/MiembroBreve' }
              presente: { type: boolean, nullable: true, description: 'null = sin registrar' }
        totales:
          type: object
          properties:
            presentes: { type: integer }
            ausentes: { type: integer }
            sinRegistrar: { type: integer }
            total: { type: integer }
    AnuncioEntrada:
      type: object
      properties:
        titulo: { type: string, maxLength: 120 }
        contenido: { type: string, maxLength: 5000, description: Texto plano o markdown simple }
        prioridad: { type: string, enum: [NORMAL, IMPORTANTE], default: NORMAL }
        fechaPublicacion: { type: string, format: date-time, description: Por defecto ahora }
        fechaExpiracion:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: 'Posterior a fechaPublicacion',
          }
        eventoId: { type: string, format: uuid, nullable: true }
    Anuncio:
      type: object
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        contenido: { type: string }
        prioridad: { type: string, enum: [NORMAL, IMPORTANTE] }
        fechaPublicacion: { type: string, format: date-time }
        fechaExpiracion: { type: string, format: date-time, nullable: true }
        autor: { type: object, properties: { id: { type: string }, nombre: { type: string } } }
        evento:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            titulo: { type: string }
            fechaInicio: { type: string, format: date-time }
            estado: { type: string, enum: [PROGRAMADO, CANCELADO, REALIZADO] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DonacionEntrada:
      type: object
      properties:
        fecha: { type: string, format: date, description: 'No futura (zona horaria de la iglesia)' }
        monto:
          type: string
          example: '1500.00'
          description: 'Decimal mayor que 0 con 2 decimales como máximo (también se acepta number)'
        concepto: { type: string, enum: [DIEZMO, OFRENDA, PRIMICIA, DONACION_ESPECIAL, OTRO] }
        conceptoDetalle:
          { type: string, nullable: true, description: 'Obligatorio si concepto = OTRO' }
        metodo: { type: string, enum: [EFECTIVO, TRANSFERENCIA, TARJETA, CHEQUE, OTRO] }
        miembroId:
          { type: string, format: uuid, nullable: true, description: 'Nulo = aportación anónima' }
        anonima: { type: boolean, description: 'true con miembroId → 400' }
        referencia: { type: string, nullable: true }
        notas: { type: string, nullable: true }
    Donacion:
      type: object
      properties:
        id: { type: string, format: uuid }
        fecha: { type: string, format: date }
        monto: { type: string, example: '1500.00' }
        concepto: { type: string }
        conceptoDetalle: { type: string, nullable: true }
        metodo: { type: string }
        anonima: { type: boolean }
        referencia: { type: string, nullable: true }
        notas: { type: string, nullable: true }
        anulada: { type: boolean }
        motivoAnulacion: { type: string, nullable: true }
        anuladaEn: { type: string, format: date-time, nullable: true }
        miembro: { allOf: [{ $ref: '#/components/schemas/MiembroBreve' }], nullable: true }
        registradoPor:
          { type: object, properties: { id: { type: string }, nombre: { type: string } } }
        actualizadoPor:
          type: object
          nullable: true
          properties: { id: { type: string }, nombre: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GrupoIngresos:
      type: object
      properties:
        clave:
          { type: string, example: '2026-10', description: 'Día, semana ISO, mes o valor del enum' }
        total: { type: string, example: '15230.00' }
        cantidad: { type: integer }
    DatoReporte:
      type: object
      properties:
        etiqueta: { type: string }
        valor: { nullable: true, oneOf: [{ type: string }, { type: number }] }
        tipo: { type: string }
    Reporte:
      type: object
      description: Formato común de los 4 reportes (lib/exportadores/reporte.ts)
      properties:
        tipo: { type: string, enum: [miembros, asistencia, ministerios, ingresos] }
        titulo: { type: string }
        subtitulo: { type: string }
        filtros: { type: array, items: { $ref: '#/components/schemas/DatoReporte' } }
        resumen: { type: array, items: { $ref: '#/components/schemas/DatoReporte' } }
        secciones:
          type: array
          items:
            type: object
            properties:
              titulo: { type: string }
              columnas:
                type: array
                items:
                  type: object
                  properties:
                    clave: { type: string }
                    titulo: { type: string }
                    tipo:
                      type: string
                      enum: [texto, fecha, fechaHora, moneda, numero, porcentaje]
                    ancho: { type: number }
              filas: { type: array, items: { type: object } }
              totales: { type: object }
        generadoEn: { type: string, format: date-time }
        generadoPor: { type: string }
  responses:
    Reporte:
      description: 'JSON { data: Reporte } o archivo PDF / Excel'
      content:
        application/json:
          {
            schema:
              { type: object, properties: { data: { $ref: '#/components/schemas/Reporte' } } },
          }
        application/pdf: { schema: { type: string, format: binary } }
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          { schema: { type: string, format: binary } }
    SinContenido: { description: Sin contenido }
    Validacion:
      {
        description: Datos no válidos,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    NoAutenticado:
      {
        description: Sin sesión o token expirado,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    Prohibido:
      {
        description: El rol no tiene permiso,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    NoEncontrado:
      {
        description: No existe,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    Conflicto:
      {
        description: Duplicado,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    ReglaNegocio:
      {
        description: Regla de negocio,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }

security:
  - bearer: []

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado del servidor
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      data: { type: object, properties: { status: { type: string, example: ok } } },
                    },
                }

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión (rate limit 5/min/IP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [email, password],
                properties: { email: { type: string }, password: { type: string } },
              }
      responses:
        '200':
          description: Access token + sesión. Además fija la cookie httpOnly `refreshToken`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/Sesion' }
                      - { type: object, properties: { accessToken: { type: string } } }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '429': { description: Demasiados intentos }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rota el refresh token (cookie) y devuelve un access token nuevo
      security: [{ cookieRefresh: [] }]
      responses:
        '200':
          description: OK
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      properties:
                        { data: { type: object, properties: { accessToken: { type: string } } } },
                    },
                },
            }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoca el refresh token (cookie) y la borra; no requiere access token
      security: [{ cookieRefresh: [] }]
      responses:
        '204': { $ref: '#/components/responses/SinContenido' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Usuario actual y sus permisos
      responses:
        '200':
          description: OK
          content:
            {
              application/json:
                {
                  schema:
                    { type: object, properties: { data: { $ref: '#/components/schemas/Sesion' } } },
                },
            }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /auth/me/password:
    patch:
      tags: [Auth]
      summary: Cambiar la contraseña propia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [passwordActual, passwordNueva],
                properties: { passwordActual: { type: string }, passwordNueva: { type: string } },
              }
      responses:
        '204': { $ref: '#/components/responses/SinContenido' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Envía un enlace de restablecimiento (responde 204 siempre)
      security: []
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { type: object, required: [email], properties: { email: { type: string } } },
              },
          }
      responses:
        '204': { $ref: '#/components/responses/SinContenido' }
        '400': { $ref: '#/components/responses/Validacion' }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Fija una contraseña nueva con el token del correo (recuperación o invitación)
      security: []
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [token, password],
                    properties: { token: { type: string }, password: { type: string } },
                  },
              },
          }
      responses:
        '204': { $ref: '#/components/responses/SinContenido' }
        '400': { $ref: '#/components/responses/Validacion' }

  /iglesias:
    get:
      tags: [Iglesias]
      summary: Listar las iglesias del sistema (iglesias:leer, solo la Coordinación)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: q, in: query, schema: { type: string }, description: Busca por nombre }
        - { name: estado, in: query, schema: { type: string, pattern: '^\d{2}$' } }
        - { name: municipio, in: query, schema: { type: string, pattern: '^\d{5}$' } }
        - {
            name: tipo,
            in: query,
            schema:
              { type: string, enum: [CATEDRAL, BASILICA, PARROQUIA, TEMPLO, CAPILLA, SANTUARIO] },
          }
        - name: situacion
          in: query
          description: Incluir cerradas (RF-12)
          schema: { type: string, enum: [activas, cerradas, todas], default: todas }
      responses:
        '200': { description: Lista paginada de iglesias }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Iglesias]
      summary: Crear una iglesia (iglesias:crear, solo la Coordinación; RF-07, RN-09)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IglesiaDatos'
                - type: object
                  required: [nombre, tipo]
                  properties:
                    nombre: { type: string, maxLength: 150 }
                    tipo:
                      {
                        type: string,
                        enum: [CATEDRAL, BASILICA, PARROQUIA, TEMPLO, CAPILLA, SANTUARIO],
                      }
                    zonaHoraria: { type: string, default: America/Mexico_City }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Iglesia' } }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /iglesias/{iglesiaId}:
    parameters:
      - { $ref: '#/components/parameters/IglesiaId' }
    get:
      tags: [Iglesias]
      summary: Detalle de una iglesia (Coordinación, o el administrador de esa iglesia)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Iglesia' } }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Iglesias]
      summary: Editar los datos (iglesias:editar; el administrador solo la suya, RF-08)
      description: Cambiar el estado sin enviar municipio deja la iglesia sin municipio ni localidad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IglesiaDatos'
                - type: object
                  properties:
                    nombre: { type: string, maxLength: 150 }
                    tipo:
                      {
                        type: string,
                        enum: [CATEDRAL, BASILICA, PARROQUIA, TEMPLO, CAPILLA, SANTUARIO],
                      }
                    zonaHoraria: { type: string }
      responses:
        '200': { description: Editada }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }

  /iglesias/{iglesiaId}/cierre:
    parameters:
      - { $ref: '#/components/parameters/IglesiaId' }
    post:
      tags: [Iglesias]
      summary: Cerrar una iglesia sin borrar su historia (iglesias:cerrar, solo la Coordinación; RF-11, RN-07)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fecha, motivo]
              properties:
                fecha: { type: string, format: date, description: No futura }
                motivo: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: Cerrada }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }

  /public/estados:
    get:
      tags: [Catálogos]
      security: []
      summary: Los estados del catálogo del INEGI (sin sesión, paginado)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 100 },
            description: Busca por nombre,
          }
      responses:
        '200': { description: 'Lista paginada de { clave, nombre }, ordenados por clave' }
        '400': { $ref: '#/components/responses/Validacion' }

  /public/estados/{clave}/municipios:
    get:
      tags: [Catálogos]
      security: []
      summary: Municipios de un estado (sin sesión, paginado)
      parameters:
        - { name: clave, in: path, required: true, schema: { type: string, pattern: '^\d{2}$' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 100 },
            description: Busca por nombre,
          }
      responses:
        '200': { description: 'Lista paginada de { clave, nombre }, ordenados por nombre' }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /public/municipios/{clave}/localidades:
    get:
      tags: [Catálogos]
      security: []
      summary: Localidades de un municipio (sin sesión, paginado)
      parameters:
        - { name: clave, in: path, required: true, schema: { type: string, pattern: '^\d{5}$' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 100 },
            description: Busca por nombre,
          }
      responses:
        '200': { description: 'Lista paginada de { clave, nombre }, ordenadas por nombre' }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /public/iglesias:
    get:
      tags: [Iglesias]
      security: []
      summary: Iglesias activas de un estado para el visitante (sin sesión, paginado; E2-07, RF-01–RF-05)
      description: >-
        Solo iglesias activas (RN-07), ordenadas por nombre. Supuestos mientras no respondan P-02 y P-03:
        q busca parte del nombre sin distinguir mayúsculas; capacidadMin y capacidadMax sirven para un
        mínimo o un rango, y con ellos no aparecen las iglesias sin capacidad registrada.
      parameters:
        - {
            name: estado,
            in: query,
            required: true,
            schema: { type: string, pattern: '^\d{2}$' },
            description: Clave del estado (RF-01),
          }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: municipio, in: query, schema: { type: string, pattern: '^\d{5}$' } }
        - { name: localidad, in: query, schema: { type: string, pattern: '^\d{9}$' } }
        - name: tipo
          in: query
          schema:
            { type: string, enum: [CATEDRAL, BASILICA, PARROQUIA, TEMPLO, CAPILLA, SANTUARIO] }
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 100 },
            description: Parte del nombre,
          }
        - { name: capacidadMin, in: query, schema: { type: integer, minimum: 1 } }
        - { name: capacidadMax, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/IglesiaPublica' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /public/iglesias/{iglesiaId}:
    parameters:
      - { $ref: '#/components/parameters/IglesiaId' }
    get:
      tags: [Iglesias]
      security: []
      summary: Ficha pública de una iglesia activa (E2-11; RF-06, RF-16, RF-18, CA-04)
      description: >-
        Datos, objetos VIGENTES (sin ubicación en el templo ni conservación, supuesto de P-05), índice y
        distinción con el año de cálculo. servicios, platicas, misas y tiposEspacio van vacíos hasta que
        Genaro y Oscar publiquen las funciones de sus services. 404 si está cerrada.
      responses:
        '200':
          description: Ficha
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FichaIglesia' }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /public/reconocidas:
    get:
      tags: [Iglesias]
      security: []
      summary: Iglesias más reconocidas, de mayor a menor índice (E2-12; RF-19–RF-21, CA-06)
      description: >-
        Sin lugar es el ranking del país; acepta un solo nivel (estado, municipio o localidad). Excluye
        cerradas y sin objetos; supuestos de P-07: tampoco entran las que no tienen objetos vigentes y
        los empates se ordenan por nombre.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: estado, in: query, schema: { type: string, pattern: '^\d{2}$' } }
        - { name: municipio, in: query, schema: { type: string, pattern: '^\d{5}$' } }
        - { name: localidad, in: query, schema: { type: string, pattern: '^\d{9}$' } }
      responses:
        '200':
          description: Lista paginada con `posicion`, `indice` y `distincion`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/IglesiaReconocida' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/Validacion' }

  /public/busqueda-patrimonio:
    get:
      tags: [Iglesias]
      security: []
      summary: Búsqueda del investigador por tipo de objeto y antigüedad en un lugar (E2-13; RF-23, CA-08)
      description: >-
        Iglesias activas del lugar con al menos un objeto vigente del tipo y la antigüedad mínima, con los
        objetos que cumplen. Supuesto de P-09: un tipo y una antigüedad mínima. Exige un lugar.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - {
            name: tipoObjeto,
            in: query,
            required: true,
            schema: { $ref: '#/components/schemas/TipoObjeto' },
          }
        - { name: antiguedadMin, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { name: estado, in: query, schema: { type: string, pattern: '^\d{2}$' } }
        - { name: municipio, in: query, schema: { type: string, pattern: '^\d{5}$' } }
        - { name: localidad, in: query, schema: { type: string, pattern: '^\d{9}$' } }
      responses:
        '200':
          {
            description: 'Lista paginada de iglesias con `objetos: [{ id, descripcion, epoca, antiguedad }]`',
          }
        '400': { $ref: '#/components/responses/Validacion' }

  /iglesias/{iglesiaId}/objetos:
    parameters:
      - { $ref: '#/components/parameters/IglesiaId' }
    get:
      tags: [Patrimonio]
      summary: Objetos de la iglesia de cualquier estado, con sus puntos (patrimonio:leer + alcanceIglesia; RF-14, RF-15)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoObjeto' } }
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoObjeto' } }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ObjetoPatrimonial' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      tags: [Patrimonio]
      summary: Registrar un objeto (patrimonio:gestionar, el administrador de esa iglesia; RF-13, RF-17, RN-10, RN-16)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjetoEntrada' }
      responses:
        '201': { description: Creado }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }

  /iglesias/{iglesiaId}/objetos/{objetoId}:
    parameters:
      - { $ref: '#/components/parameters/IglesiaId' }
      - { name: objetoId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Patrimonio]
      summary: Cambiar los datos de un objeto, no su estado (patrimonio:gestionar; RF-14)
      description: Año y siglo se validan contra lo guardado (400, no 500). Un objeto dado de baja ya no se edita (422).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjetoEntrada' }
      responses:
        '200': { description: Editado }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }

  /iglesias/{iglesiaId}/objetos/{objetoId}/estado:
    parameters:
      - { $ref: '#/components/parameters/IglesiaId' }
      - { name: objetoId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Patrimonio]
      summary: Marcar un objeto como perdido, prestado o dado de baja, o su regreso (patrimonio:gestionar; RF-15, RN-11, CA-05)
      description: >-
        VIGENTE → PERDIDO, PRESTADO o BAJA. Un objeto prestado o perdido puede regresar (VIGENTE, supuesto
        de P-08) o darse de baja; la BAJA es definitiva. Nunca se borra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado, fecha, motivo]
              properties:
                estado: { $ref: '#/components/schemas/EstadoObjeto' }
                fecha: { type: string, format: date, description: No futura }
                motivo: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: Estado cambiado }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }

  /iglesias/{iglesiaId}/indice:
    parameters:
      - { $ref: '#/components/parameters/IglesiaId' }
    get:
      tags: [Patrimonio]
      summary: Índice y distinción de la iglesia con los criterios vigentes (patrimonio:leer; RF-18)
      responses:
        '200':
          description: '{ indice, distincion, anioCalculo, objetosRegistrados, objetosVigentes }'
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /criterios-indice:
    get:
      tags: [Patrimonio]
      summary: Criterios vigentes del índice (criterios:leer, la Coordinación; RF-22)
      description: '`id`, `vigenteDesde` y `creadoPor` son null mientras se usen los criterios del caso.'
      responses:
        '200':
          description: Criterios vigentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CriteriosIndice' }
        '403': { $ref: '#/components/responses/Prohibido' }
    put:
      tags: [Patrimonio]
      summary: Guardar una versión nueva de los criterios (criterios:editar; RF-22, RN-14, CA-07)
      description: >-
        Rangos desde 0 años, ordenados y sin repetir; multiplicadores de los cinco grupos; distinciones de
        mayor a menor mínimo con nombres distintos; todo con un decimal como máximo (ADR-0005).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CriteriosIndice' }
      responses:
        '200': { description: Versión guardada; el índice de todas las iglesias cambia }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /criterios-indice/historial:
    get:
      tags: [Patrimonio]
      summary: Versiones de los criterios, de la más reciente a la más antigua (criterios:leer; RF-22)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Lista paginada de versiones con `vigenteDesde` y `creadoPor` }
        '403': { $ref: '#/components/responses/Prohibido' }

  /catalogos/importacion:
    post:
      tags: [Catálogos]
      summary: Cargar o actualizar el catálogo del INEGI (catalogos:gestionar, solo la Coordinación; RF-10)
      description: >
        Inserta lo nuevo y actualiza nombres; nunca borra. Todo o nada. Para el archivo completo usa
        el script `pnpm --filter backend db:catalogos <archivo.csv>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filas]
              properties:
                filas:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [cveEnt, nomEnt]
                    properties:
                      cveEnt: { type: string, pattern: '^\d{2}$' }
                      nomEnt: { type: string }
                      cveMun: { type: string, pattern: '^\d{3}$' }
                      nomMun: { type: string }
                      cveLoc: { type: string, pattern: '^\d{4}$' }
                      nomLoc: { type: string }
      responses:
        '200': { description: '{ leidas, cambiadas } por nivel' }
        '400': { $ref: '#/components/responses/Validacion' }
